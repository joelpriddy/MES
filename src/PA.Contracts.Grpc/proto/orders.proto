
syntax = "proto3";
package orders.v1;

service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (OrderResponse);
  rpc GetOrder    (GetOrderRequest)    returns (OrderResponse);
  rpc MarkShipped (MarkShippedRequest) returns (OrderResponse);
}

message CreateOrderRequest { Order order = 1; }
message GetOrderRequest    { int64 id = 1; }
message MarkShippedRequest { int64 id = 1; }

message OrderResponse { Order order = 1; }

message Order {
  int64 id = 1;
  int64 customerId = 2;
  string status = 3;
  double total = 4;
  int64 createdOnUnix = 5;
  repeated OrderLine lines = 6;
}

message OrderLine {
  int64 productId = 1;
  double quantity = 2;
  double unitPrice = 3;
}
