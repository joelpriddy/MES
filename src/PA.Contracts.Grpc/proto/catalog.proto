
syntax = "proto3";
package catalog.v1;

service CatalogService {
  rpc GetProductBySku (GetProductBySkuRequest) returns (GetProductResponse);
  rpc SearchProducts  (SearchProductsRequest)  returns (SearchProductsResponse);
  rpc UpsertProduct   (UpsertProductRequest)   returns (UpsertProductResponse);
}

message GetProductBySkuRequest { string sku = 1; }
message GetProductResponse     { Product product = 1; }

message SearchProductsRequest  { string query = 1; int32 page = 2; int32 size = 3; }
message SearchProductsResponse { repeated Product items = 1; int32 total = 2; }

message UpsertProductRequest   { Product product = 1; }
message UpsertProductResponse  { Product product = 1; }

message Product {
  int64 id = 1;
  string sku = 2;
  string name = 3;
  string description = 4;
  bool isManufactured = 5;
  double price = 6;
  string unitOfMeasure = 7;
  bool active = 8;
  string subtype = 9;
  double sizeLb = 10;
}
