services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pa_mes
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.7
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      # Two listeners: inside Docker network - redpanda:9092, from Windows host - localhost:19092
      - --kafka-addr PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092,PLAINTEXT_HOST://localhost:19092
    ports:
      - "9092:9092"     # internal clients (other containers) use redpanda:9092
      - "19092:19092"   # host apps (APIs on Windows) use localhost:19092
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - REDPANDA_ADMIN_API=http://redpanda:9644
    ports:
      - "8080:8080"
    depends_on:
      - redpanda
  inventory-worker:
    image: pa.inventory.worker:dev
    environment:
      - ConnectionStrings__Default=server=mysql;port=3306;database=pa_mes_inventory;user=root;password=root
      - Kafka__BootstrapServers=redpanda:9092
      - Kafka__GroupId=inventory-worker
      - Kafka__TopicOrderCreated=orders.created
      - Kafka__TopicOrderShipped=orders.shipped
      - Kafka__TopicOrderCanceled=orders.canceled
    depends_on:
      - mysql
      - redpanda

  inventory-api:
    build:
      context: .
      dockerfile: src/Services/Inventory/PA.Inventory.Api/Dockerfile
    environment:
      - HTTP_PORT=8080
      - ConnectionStrings__Default=server=mysql;port=3306;database=pa_mes_inventory;user=root;password=root
      - Kafka__BootstrapServers=redpanda:9092
      - Kafka__GroupId=inventory-api
      - RUN_KAFKA_CONSUMER=false
    depends_on:
      - mysql
      - redpanda
    ports:
      - "5081:8080"

  orders-api:
    build:
      context: .
      dockerfile: src/Services/Orders/PA.Orders.Api/Dockerfile
    environment:
      - HTTP_PORT=8080
      - ConnectionStrings__Default=server=mysql;port=3306;database=pa_mes_orders;user=root;password=root
      - Kafka__BootstrapServers=redpanda:9092
      - Kafka__GroupId=orders-api
    depends_on:
      - mysql
      - redpanda
    ports:
      - "5082:8080"
  catalog-api:
    build:
      context: .
      dockerfile: src/Services/Catalog/PA.Catalog.Api/Dockerfile
    environment:
      - HTTP_PORT=8080
      - ConnectionStrings__Default=server=mysql;port=3306;database=pa_mes_catalog;user=root;password=root
      - Kafka__BootstrapServers=redpanda:9092
      - Kafka__GroupId=catalog-api
    depends_on:
      - mysql
      - redpanda
    ports:
      - "5080:8080"

volumes:
  mysql_data:
  redpanda_data:
