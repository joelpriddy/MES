services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
    - 3306:3306
    volumes:
    - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h 127.0.0.1 -proot || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.7
    command:
    - redpanda
    - start
    - --overprovisioned
    - --smp
    - '1'
    - --memory
    - 1G
    - --reserve-memory
    - 0M
    - --node-id
    - '0'
    - --check=false
    ports:
    - 9092:9092
    - 9644:9644
    volumes:
    - redpanda_data:/var/lib/redpanda/data
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDPANDA_ADMIN_API: http://redpanda:9644
    ports:
    - 8080:8080
    depends_on:
    - redpanda
  catalog-api:
    build:
      context: .
      dockerfile: src/Services/Catalog/PA.Catalog.Api/Dockerfile
    depends_on:
    - mysql
    - redpanda
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PA_CATALOG_CS: server=mysql;port=3306;database=pa_mes_catalog;user=root;password=root
    ports: []
  inventory-api:
    build:
      context: .
      dockerfile: src/Services/Inventory/PA.Inventory.Api/Dockerfile
    depends_on:
    - mysql
    - redpanda
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PA_INVENTORY_CS: server=mysql;port=3306;database=pa_mes_inventory;user=root;password=root
    ports: []
  manufacturing-api:
    build:
      context: .
      dockerfile: src/Services/Manufacturing/PA.Manufacturing.Api/Dockerfile
    depends_on:
    - mysql
    - redpanda
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PA_MANUFACTURING_CS: server=mysql;port=3306;database=pa_mes_manufacturing;user=root;password=root
    ports: []
  orders-api:
    build:
      context: .
      dockerfile: src/Services/Orders/PA.Orders.Api/Dockerfile
    depends_on:
    - mysql
    - redpanda
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PA_ORDERS_CS: server=mysql;port=3306;database=pa_mes_orders;user=root;password=root
    ports: []
  payments-api:
    build:
      context: .
      dockerfile: src/Services/Payments/PA.Payments.Api/Dockerfile
    depends_on:
    - mysql
    - redpanda
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PA_PAYMENTS_CS: server=mysql;port=3306;database=pa_mes_payments;user=root;password=root
    ports: []
  shipping-api:
    build:
      context: .
      dockerfile: src/Services/Shipping/PA.Shipping.Api/Dockerfile
    depends_on:
    - mysql
    - redpanda
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PA_SHIPPING_CS: server=mysql;port=3306;database=pa_mes_shipping;user=root;password=root
    ports: []
  customers-api:
    build:
      context: .
      dockerfile: src/Services/Customers/PA.Customers.Api/Dockerfile
    depends_on:
    - mysql
    - redpanda
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PA_CUSTOMERS_CS: server=mysql;port=3306;database=pa_mes_customers;user=root;password=root
    ports: []
  gateway-api:
    build:
      context: .
      dockerfile: src/Services/Gateway/PA.Gateway.Api/Dockerfile
    depends_on:
    - mysql
    - redpanda
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
    - 8081:8080
volumes:
  mysql_data: {}
  redpanda_data: {}
